<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4566E8" />
    <title>דיווח חודשי למשרד הביטחון</title>
    <style>
      *{box-sizing:border-box}
      html{color-scheme:light}body{background-image:radial-gradient(900px 420px at 85% -80px,rgba(99,132,255,.16),transparent 70%),radial-gradient(700px 360px at 10% -60px,rgba(168,140,255,.12),transparent 70%);background-repeat:no-repeat}.row-btn{transition:background 160ms cubic-bezier(0.16,1,0.3,1)}.row-btn:hover{background:#F2F5FB!important}html,body{margin:0;background-color:#F6F8FD;color:#101828;font-family:'IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
      button,input,select{font-family:inherit}
      input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
      input[type=number]{-moz-appearance:textfield}
      :focus-visible{outline:2px solid #2F6FEB;outline-offset:2px}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
