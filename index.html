<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F3A5F" />
    <title>דיווח חודשי למשרד הביטחון</title>
    <style>
      *{box-sizing:border-box}
      html{color-scheme:light}.row-btn{transition:background 160ms cubic-bezier(0.16,1,0.3,1)}.row-btn:hover{background:#F7F9FD!important}html,body{margin:0;background:#F4F7FC;color:#14181F;font-family:'IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
      button,input,select{font-family:inherit}
      input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
      input[type=number]{-moz-appearance:textfield}
      :focus-visible{outline:2px solid #2F6FEB;outline-offset:2px}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes fade{from{opacity:0}to{opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
